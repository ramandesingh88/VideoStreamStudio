
name: .NET Foundation CI

'on':
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      -  name: Inspect checkout structure
          run: |
          echo "Current directory:"
          pwd

          echo "Repository root:"
          ls -la

          echo "Tracked solution files:"
          git ls-files '*.slnx' '*.sln'

          echo "Tracked project files:"
          git ls-files '*.csproj'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore backend/VideoStream.slnx

      - name: Build solution
        run: dotnet build backend/VideoStream.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test backend/VideoStream.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
